name: Build container image
on:
  push:
    branches:
      - main
      - testing
    paths:
      - 'Containerfile'
      - 'system_files/**'
      - 'build_files/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
      - testing
    paths:
      - 'Containerfile'
      - 'system_files/**'
      - 'build_files/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Restrict default permissions for all jobs (least privilege)
permissions:
  contents: read

env:
  IMAGE_DESC: "HyprBazzite"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,bazzite"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/22166252?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts and Containerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './system_files/usr'
          additional_files: 'scripts/verify-image.sh system_files/usr/bin/wallpaper-cycle'
          severity: error
          ignore_paths: >-
            system_files/usr/lib/hyprbazzite/skel

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile
          failure-threshold: warning
          # DL3007 - FROM :latest in assets stage is acceptable (build-only)
          # DL3015 - --no-install-recommends not applicable to dnf
          # DL3018 - apk version pinning not practical for the assets tool base
          # DL3033 - dnf clean all is handled per-layer
          # DL3041 - dnf version pinning not practical for COPR packages
          # DL3059 - multiple consecutive RUN intentional for readability
          # SC2015 - A && B || C pattern is used safely in cleanup steps
          ignore: DL3007,DL3015,DL3018,DL3033,DL3041,DL3059,SC2015

  # Decide which image variants to build. PRs build only the default variant
  # for fast feedback; push/schedule/dispatch build both default and -nvidia.
  prepare_matrix:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set
        run: |
          nvidia='{"variant":"nvidia","base_image":"ghcr.io/ublue-os/bazzite-nvidia-open:stable-44.20260908","tag_suffix":"-nvidia","primary_tag":"latest-nvidia"}'
          main='{"variant":"main","base_image":"ghcr.io/ublue-os/bazzite:stable-44.20260908","tag_suffix":"","primary_tag":"latest"}'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "matrix={\"include\":[${main}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[${main},${nvidia}]}" >> "$GITHUB_OUTPUT"
          fi

  build_push:
    name: Build and push (${{ matrix.variant }})
    needs: [lint, prepare_matrix]
    # Fail fast: only build if lint passed (skips a ~40-60 min build when a
    # cheap shellcheck/hadolint error would fail it anyway).
    #
    # PR builds are lean: they build + verify the image only (to prove changes
    # compile into a valid image) and skip everything prod-related — no push,
    # SBOM, signing, or cleanup. Draft PRs don't build at all until marked ready.
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.prepare_matrix.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on: ubuntu-24.04
    # 120 min headroom: the -nvidia variant uses a larger base
    # (bazzite-nvidia-open) whose first, uncached build does a big cold pull.
    # Matrix legs run in parallel so this is per-variant, not additive.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Get base image digest
        id: base_digest
        run: |
          BASE_DIGEST=$(skopeo inspect "docker://${{ matrix.base_image }}" | jq -r '.Digest')
          echo "digest=${BASE_DIGEST}" >> $GITHUB_OUTPUT
          echo "Base image (${{ matrix.base_image }}) digest: ${BASE_DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=latest${{ matrix.tag_suffix }},enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=stable${{ matrix.tag_suffix }}.{{date 'YYYYMMDD'}}-${{ steps.vars.outputs.sha_short }},enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=testing${{ matrix.tag_suffix }},enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/testing' }}
            type=raw,value=testing${{ matrix.tag_suffix }}.{{date 'YYYYMMDD'}}-${{ steps.vars.outputs.sha_short }},enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/testing' }}
            type=raw,value=pr-${{ github.event.pull_request.number }}${{ matrix.tag_suffix }},enable=${{ github.event_name == 'pull_request' }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            org.opencontainers.image.base.name=${{ matrix.base_image }}
            org.opencontainers.image.base.digest=${{ steps.base_digest.outputs.digest }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: true
          extra-args: |
            --layers=false
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            SHA_HEAD_SHORT=${{ steps.vars.outputs.sha_short }}
            BUILD_STAMP=${{ steps.metadata.outputs.version }}

      - name: Verify image integrity
        run: |
          # Use the first tag from metadata for verification
          TAGS=(${{ steps.metadata.outputs.tags }})
          FIRST_TAG=${TAGS[0]}
          echo "first_tag=$FIRST_TAG" >> "$GITHUB_ENV"
          echo "Verifying image with tag: $FIRST_TAG"
          podman run --rm --pull=never \
            -v "${{ github.workspace }}/scripts/verify-image.sh:/tmp/verify-image.sh:ro" \
            "localhost/${{ env.IMAGE_NAME }}:$FIRST_TAG" \
            bash /tmp/verify-image.sh

      # SBOM generation + attestation is the only prod-only supply-chain step
      # (skipped on PRs). Rather than have syft ingest the entire ~13GB image
      # (which took ~6 min and ~40GB RAM, swapping the runner to a crawl), we
      # extract just the RPM database (~110MB) and scan that. This is an
      # RPM-based image, so the rpmdb IS the package inventory. Measured locally:
      # ~3s and <300MB RAM vs 6+ min and 40GB.
      - name: Extract RPM database for SBOM
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/sbomroot"
          mkdir -p "${dest}/usr/lib/sysimage"
          cid=$(podman create "localhost/${IMAGE_NAME}:${first_tag}")
          # Fedora bootc keeps the rpmdb at /usr/lib/sysimage/rpm
          # (/var/lib/rpm is a symlink to it). Fall back just in case.
          if ! podman cp "${cid}:/usr/lib/sysimage/rpm" "${dest}/usr/lib/sysimage/rpm" 2>/dev/null; then
            mkdir -p "${dest}/var/lib"
            podman cp "${cid}:/var/lib/rpm" "${dest}/var/lib/rpm"
          fi
          podman rm "${cid}" >/dev/null
          du -sh "${dest}"

      - name: Generate SBOM (RPM database)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: "${{ runner.temp }}/sbomroot"
          format: spdx-json
          output-file: sbom.spdx.json
          # Don't upload as a workflow artifact — both matrix variants would use
          # the same artifact name and collide. The SBOM is attested to the image
          # (below), which is the durable copy.
          upload-artifact: false
          upload-release-assets: false

      # Push on every build EXCEPT fork PRs (their token is read-only).
      # Same-repo PRs publish a `pr-N` tag so reviewers can `bootc switch` to the
      # image; branches publish latest/testing/dated tags.
      - name: Push Image to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        id: push
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        env:
          COSIGN_REGISTRY_USERNAME: ${{ github.actor }}
          COSIGN_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign attest --yes --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      # Sign every pushed image (including same-repo PR images) so `bootc switch`
      # works even when the host enforces a signature policy.
      - name: Sign Image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          COSIGN_REGISTRY_USERNAME: ${{ github.actor }}
          COSIGN_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Verify Signature
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  cleanup:
    name: Cleanup old package versions
    needs: build_push
    if: always() && needs.build_push.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Delete old untagged images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true

      - name: Delete old cosign signature tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"

          # Get all versions, filter to sha256-* signature tags, keep only the latest 3
          gh api --paginate \
            "/user/packages/container/${PACKAGE}/versions" \
            --jq '.[] | select(.metadata.container.tags | any(startswith("sha256-"))) | .id' \
          | tail -n +4 \
          | while read -r version_id; do
              echo "Deleting old signature version: $version_id"
              gh api --method DELETE \
                "/user/packages/container/${PACKAGE}/versions/${version_id}" || true
            done

  pr_summary:
    name: PR change summary
    # Same-repo, non-draft PRs only. Fork PRs get a read-only token so they
    # can't post comments; restricting to same-repo avoids a guaranteed failure.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post / update change summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 1. Changed files vs base branch — one fast paginated API call,
          #    no git history checkout required.
          gh api --paginate "/repos/${REPO}/pulls/${PR}/files" > files.json

          total_files=$(jq 'length' files.json)
          total_add=$(jq '[.[].additions] | add // 0' files.json)
          total_del=$(jq '[.[].deletions] | add // 0' files.json)
          short_sha=$(echo "${HEAD_SHA}" | cut -c1-7)
          image_lc=$(echo "ghcr.io/${REPO}" | tr '[:upper:]' '[:lower:]')

          # 2. Group files by project area and render a table per area.
          cat > cat.jq <<'JQ'
          def category:
            .filename as $f |
            if $f == "Containerfile" then "Container build"
            elif ($f | startswith(".github/")) then "CI / automation"
            elif ($f | startswith("disk_config/")) then "Disk / ISO config"
            elif ($f | test("system_files/usr/lib/hyprbazzite/hypr/")) then "Hyprland"
            elif ($f | test("system_files/usr/lib/hyprbazzite/waybar/")) then "Waybar"
            elif ($f | test("system_files/usr/lib/hyprbazzite/wofi/")) then "Wofi"
            elif ($f | test("system_files/usr/lib/hyprbazzite/xdg/swaync/")) then "Notifications"
            elif ($f | test("system_files/usr/share/sddm/")) then "Login (SDDM)"
            elif ($f | test("system_files/usr/lib/systemd/")) then "systemd units"
            elif ($f | test("system_files/usr/(bin|libexec)/")) then "Scripts / binaries"
            elif ($f | startswith("system_files/")) then "System files (other)"
            elif ($f | test("\\.md$")) then "Docs"
            else "Other" end;
          def statusword:
            {"added":"Added","removed":"Removed","renamed":"Renamed","modified":"Modified","changed":"Modified"}[.status] // "Modified";
          (map(. + {cat: category}) | sort_by(.cat, .filename) | group_by(.cat))
          | map(
              "#### \(.[0].cat) (\(length))\n\n"
              + "| File | Change | Lines |\n|---|---|---|\n"
              + ( map(
                    "| `\(if .status=="renamed" then (.previous_filename + " → " + .filename) else .filename end)` "
                    + "| \(statusword) "
                    + "| `+\(.additions) / -\(.deletions)` |"
                  ) | join("\n") )
            )
          | join("\n\n")
          JQ

          sections=$(jq -r -f cat.jq files.json)

          # 3. Assemble the comment body. Headline stats stay visible; the full
          #    per-area breakdown is collapsible so the comment stays compact.
          MARKER="<!-- hyprbazzite-pr-change-summary -->"
          {
            echo "${MARKER}"
            echo "## PR change summary"
            echo ""
            echo "**${total_files} file(s) changed**  ·  \`+${total_add} / -${total_del}\`  ·  base \`${BASE_REF}\` ← \`${HEAD_REF}\`"
            echo ""
            echo "<details><summary><b>Changed files by area</b> (click to expand)</summary>"
            echo ""
            echo "${sections}"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo "> **Test this PR on real hardware** once the build finishes:"
            echo "> \`\`\`bash"
            echo "> sudo bootc switch ${image_lc}:pr-${PR}"
            echo "> sudo systemctl reboot"
            echo "> # roll back with: sudo bootc rollback"
            echo "> \`\`\`"
            echo ""
            echo "<sub>Auto-updated for commit \`${short_sha}\` · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > body.md

          # 4. Upsert: find our comment by its hidden marker, update it if it
          #    exists, otherwise create it. Keeps a single sticky comment.
          existing=$(gh api --paginate "/repos/${REPO}/issues/${PR}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1 || true)

          if [ -n "${existing}" ]; then
            gh api --method PATCH "/repos/${REPO}/issues/comments/${existing}" -F body=@body.md >/dev/null
            echo "Updated existing summary comment (${existing})."
          else
            gh api --method POST "/repos/${REPO}/issues/${PR}/comments" -F body=@body.md >/dev/null
            echo "Created new summary comment."
          fi
